<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker Transactions History</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Transaction History</h1>
            <p>View and manage your recorded expenses</p>
        </header>

        <main>
            <section class="transactions-list">
                <div class="list-header">
                    <h2>Latest Transactions</h2>
                    <button id="downloadExcel" class="download-btn">Download Excel</button>
                </div>

                <!-- ✅ PERIOD FILTER (NEW) -->
                <section class="period-section" style="margin-top: 10px;">
                    <h2 style="font-size: 1.1rem;">Period Filter</h2>

                    <div class="period-filter">
                        <div class="period-buttons" id="txPeriodButtons">
                            <button class="chip" data-period="lastWeek" type="button">Last Week</button>
                            <button class="chip" data-period="today" type="button">Today</button>
                            <button class="chip" data-period="thisWeek" type="button">This Week</button>
                            <button class="chip active" data-period="thisMonth" type="button">This Month</button>
                            <button class="chip" data-period="custom" type="button">Custom</button>
                        </div>

                        <div class="custom-range" id="txCustomRange">
                            <label for="txDateFrom">Date From</label>
                            <input type="date" id="txDateFrom">

                            <label for="txDateTo">Date To</label>
                            <input type="date" id="txDateTo">

                            <button class="apply-btn" id="txApplyCustom" type="button">Apply</button>
                        </div>

                        <div class="range-label" id="txRangeLabel"></div>
                    </div>
                </section>

                <div class="table-responsive">
                    <table id="transactionsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Transaction Code</th>
                                <th>Amount</th>
                                <th>Fee</th>
                                <th>Category</th>
                                <th>Total Amount</th>
                                <th>Balance</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody">
                            <!-- Transactions will be added here dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer>
            <nav>
                <a href="index.html">Home</a>
                <a href="transactions.html" class="active">Transactions</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>
        </footer>
    </div>

    <script src="transactions.js"></script>
</body>
</html>
