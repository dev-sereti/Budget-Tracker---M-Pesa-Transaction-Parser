<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard</h1>
            <p>Track your monthly expenditure and financial health</p>
        </header>

        <main>
            <section class="income-section">
                <h2>Monthly Budget</h2>
                <div class="income-input">
                    <label for="monthlyIncome"> <b>Budget</b></label>
                    <input type="number" id="monthlyIncome" placeholder="e.g., 50000" min="0">
                    <button id="setIncome">Set</button>
                </div>
            </section>

            <!-- ✅ PERIOD FILTER (NEW) -->
            <section class="period-section">
                <h2>Period Filter</h2>

                <div class="period-filter">
                    <div class="period-buttons" id="dashPeriodButtons">
                        <button class="chip" data-period="lastWeek">Last Week</button>
                        <button class="chip" data-period="today">Today</button>
                        <button class="chip" data-period="thisWeek">This Week</button>
                        <button class="chip active" data-period="thisMonth">This Month</button>
                        <button class="chip" data-period="custom">Custom</button>
                    </div>

                    <div class="custom-range" id="dashCustomRange">
                        <label for="dashDateFrom">Date From</label>
                        <input type="date" id="dashDateFrom" />
                        <label for="dashDateTo">Date To</label>
                        <input type="date" id="dashDateTo" />
                        <button class="apply-btn" id="dashApplyCustom">Apply</button>
                    </div>

                    <div class="range-label" id="dashRangeLabel"></div>
                </div>
            </section>

            <section class="kpi-section">
                <h2>Financial Overview</h2>
                <div class="kpi-cards">
                    <div class="kpi-card">
                        <h3>Total Spent</h3>
                        <div id="totalSpent" class="kpi-value">Ksh 0.00</div>
                    </div>
                    <div class="kpi-card">
                        <h3>Remaining Balance</h3>
                        <div id="remainingBalance" class="kpi-value">Ksh 0.00</div>
                    </div>
                    <div class="kpi-card">
                        <h3>Savings Rate</h3>
                        <div id="savingsRate" class="kpi-value">0%</div>
                    </div>
                </div>
            </section>

            <section class="visualizations">
                <h2>Financial Visualizations</h2>
                <div class="charts-container">
                    <div class="chart-wrapper small">
                        <h3>Spending by Category</h3>

                        <div class="donut-box">
                            <canvas id="doughnutChart"></canvas>
                            <div class="donut-center">
                                <div class="donut-center-title">Total Spent</div>
                                <div id="donutCenterValue" class="donut-center-value">Ksh 0</div>
                            </div>
                        </div>

                        <!-- Optional donut legend if you want it too -->
                        <div id="donutLegend" class="chart-legend"></div>
                    </div>

                    <div class="chart-wrapper small">
                        <h3>Spending Trends</h3>
                        <div class="bar-box">
                            <canvas id="barChart"></canvas>
                        </div>
                        <div id="barChartLegend" class="chart-legend"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <nav>
                <a href="index.html">Home</a>
                <a href="transactions.html">Transactions</a>
                <a href="dashboard.html" class="active">Dashboard</a>
            </nav>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
