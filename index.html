<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker - Home</title>
    <link rel="stylesheet" href="style.css">
    <!-- Web icon (favicon) -->
    <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Budget Tracker</h1>
            <p>Parse your M-Pesa transactions and track your spending</p>
        </header>

        <main>
            <section class="parser-section">
                <h2>Transaction Parser</h2>
                <div class="input-container">
                    <textarea id="transactionInput" placeholder="Paste your M-Pesa transaction message here..."></textarea>
                    <div class="controls">
                        <button id="parseButton">Check Validity</button>
                        <select id="categorySelect">
                            <option value="">Select Category</option>
                            <option value="Saving">Saving</option>
                            <option value="Food">Food</option>
                            <option value="Family">Family</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Housing">Housing</option>
                            <option value="Authenticity">Authenticity</option>
                            <option value="Others">Others</option>
                            <option value="Clothing">Clothing</option>
                        </select>
                        <button id="addTransaction">Save Transaction</button>
                    </div>
                </div>

                <div class="results-container">
                    <h3>Parsed Results</h3>
                    <div id="parsedResults" class="parsed-results">
                        <!-- Parsed results will appear here -->
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="transactions.html">Transactions</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
